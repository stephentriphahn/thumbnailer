apiVersion: v2
name: platform
description: Shared platform components (AWS emulator, KEDA, External Secrets)
type: application
version: 0.1.0
dependencies:
  - name: aws-emulator
    version: 0.1.0
    repository: file://../aws-emulator
    condition: awsEmulator.enabled
  - name: keda
    version: 2.21.1
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
  - name: external-secrets
    version: 2.15.0
    repository: https://charts.external-secrets.io
    condition: external-secrets.enabled
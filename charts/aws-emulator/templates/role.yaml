apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-emulator-ca-publisher
  labels:
    {{- include "aws-emulator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]                 # can't be limited by name: the object doesn't exist yet
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aws-emulator-ca"]
    verbs: ["get", "patch"]